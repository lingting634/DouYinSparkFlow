name: Schedule Spark Flow

on:
  workflow_dispatch:
  schedule:
    # 北京时间 9:00 / 14:00 / 20:00 = UTC 1:00 / 6:00 / 12:00
    - cron: '0 1 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'

# 最小权限：只需要读仓库；额外给 issues:write 用于失败告警（Cookie 失效时自动开 Issue）
permissions:
  contents: read
  issues: write

# 同一时间只跑一个实例，避免重复发送
concurrency:
  group: douyin-spark-flow-dev
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      # 只显式注入白名单变量：任务清单与各账号 Cookie 均来自 secrets。
      - name: Run task
        env:
          MESSAGE_TEMPLATE: ${{ secrets.MESSAGE_TEMPLATE }}
          HITOKOTO_TYPES: ${{ secrets.HITOKOTO_TYPES }}
          MATCH_MODE: ${{ secrets.MATCH_MODE }}
          BROWSER_TIMEOUT: ${{ secrets.BROWSER_TIMEOUT }}
          FRIEND_LIST_WAIT_TIME: ${{ secrets.FRIEND_LIST_WAIT_TIME }}
          TASK_RETRY_TIMES: ${{ secrets.TASK_RETRY_TIMES }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          TASKS: ${{ secrets.TASKS }}
          COOKIES_87392064267: ${{ secrets.COOKIES_87392064267 }}
          # 发送确认/表头确认的选择器（留空则对应功能关闭）
          OUTGOING_BUBBLE_SELECTOR: ${{ vars.OUTGOING_BUBBLE_SELECTOR }}
          FAILED_BUBBLE_SELECTOR: ${{ vars.FAILED_BUBBLE_SELECTOR }}
          CHAT_HEADER_TITLE_SELECTOR: ${{ vars.CHAT_HEADER_TITLE_SELECTOR }}
          # 只读诊断模式：搜索/点击/表头校验执行但发送前停止（DRY_RUN=1 时绝不误发）
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python main.py

      # 只失败时上传：脱敏文本日志（.txt） + 截图（.png），不含完整 HTML / .env / Cookie
      - name: Upload debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: |
            logs/**/*.txt
            logs/**/*.png
          if-no-files-found: ignore

      # 成功时：若存在历史告警 Issue 则评论并关闭（说明已恢复）
      - name: Close alert on success
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -u
          OPEN_NO=$(gh issue list --repo "${{ github.repository }}" --state open --label spark-alert --limit 1 --json number --jq '.[0].number')
          if [ -n "${OPEN_NO:-}" ]; then
            gh issue comment "$OPEN_NO" --repo "${{ github.repository }}" --body "已恢复正常：run #${RUN_NO} 成功。"
            gh issue close "$OPEN_NO" --repo "${{ github.repository }}"
          fi

      # 失败时：自动创建/更新告警 Issue（GitHub 会发邮件通知，避免静默失败好几天）
      - name: Alert on failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NO: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          BODY=$(cat <<EOF
          火花任务失败（run #${RUN_NO}）

          - 时间(UTC)：$(date -u '+%Y-%m-%d %H:%M:%S')
          - 运行日志：${RUN_URL}

          **最可能的原因：抖音 Cookie 登录态已失效。**
          修复方法：在电脑浏览器登录抖音后，用 Cookie-Editor 重新导出 Cookie，
          更新仓库 Secret \`COOKIES_87392064267\` 即可。

          其他可能原因：抖音页面改版导致选择器失配 / 运行环境网络异常。
          EOF
          )
          OPEN_NO=$(gh issue list --repo "${{ github.repository }}" --state open --label spark-alert --limit 1 --json number --jq '.[0].number')
          if [ -n "${OPEN_NO:-}" ]; then
            gh issue comment "$OPEN_NO" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh label create spark-alert --repo "${{ github.repository }}" --color D93F0B --description "火花任务失败告警" 2>/dev/null || true
            gh issue create --repo "${{ github.repository }}" --title "火花任务失败：可能需要重新导出 Cookie" --label spark-alert --body "$BODY"
          fi
