name: Schedule Spark Flow

on:
  workflow_dispatch:
  # 【2026-09-11 已停用定时触发】云端（Azure 美国 IP + 无头浏览器）批量发送后，
  # 抖音会在十几分钟~1 小时内作废整份登录态，且会把本机登录态一起带掉线。
  # 改为以本机通道为主力（本机 12:00 任务，8/25~9/9 连续 16 天正常）。
  # 需要恢复云端定时：把下面三行 cron 前面的 # 去掉即可。
  # schedule:
  #   # 北京时间 9:00 / 14:00 / 20:00 = UTC 1:00 / 6:00 / 12:00
  #   - cron: '0 1 * * *'
  #   - cron: '0 6 * * *'
  #   - cron: '0 12 * * *'

# 最小权限：只需要读仓库；额外给 issues:write 用于失败告警（Cookie 失效时自动开 Issue）
permissions:
  contents: read
  issues: write

# 同一时间只跑一个实例，避免重复发送
concurrency:
  group: douyin-spark-flow-dev
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      # 只显式注入白名单变量：任务清单与各账号 Cookie 均来自 secrets。
      - name: Run task
        env:
          MESSAGE_TEMPLATE: ${{ secrets.MESSAGE_TEMPLATE }}
          HITOKOTO_TYPES: ${{ secrets.HITOKOTO_TYPES }}
          MATCH_MODE: ${{ secrets.MATCH_MODE }}
          BROWSER_TIMEOUT: ${{ secrets.BROWSER_TIMEOUT }}
          FRIEND_LIST_WAIT_TIME: ${{ secrets.FRIEND_LIST_WAIT_TIME }}
          TASK_RETRY_TIMES: ${{ secrets.TASK_RETRY_TIMES }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          TASKS: ${{ secrets.TASKS }}
          COOKIES_87392064267: ${{ secrets.COOKIES_87392064267 }}
          # 发送确认/表头确认的选择器（留空则对应功能关闭）
          OUTGOING_BUBBLE_SELECTOR: ${{ vars.OUTGOING_BUBBLE_SELECTOR }}
          FAILED_BUBBLE_SELECTOR: ${{ vars.FAILED_BUBBLE_SELECTOR }}
          CHAT_HEADER_TITLE_SELECTOR: ${{ vars.CHAT_HEADER_TITLE_SELECTOR }}
          # 只读诊断模式：搜索/点击/表头校验执行但发送前停止（DRY_RUN=1 时绝不误发）
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python main.py

      # 只失败时上传：脱敏文本日志（.txt） + 截图（.png），不含完整 HTML / .env / Cookie
      - name: Upload debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: |
            logs/**/*.txt
            logs/**/*.png
          if-no-files-found: ignore

      # 成功时：若存在历史告警 Issue 则评论并关闭（说明已恢复）
      - name: Close alert on success
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NO: ${{ github.run_number }}
        run: |
          OPEN_NO=$(gh issue list --repo "${{ github.repository }}" --state open --label spark-alert --limit 1 --json number -q '.[0].number' 2>/dev/null) || true
          if [ -n "${OPEN_NO}" ]; then
            gh issue comment "${OPEN_NO}" --repo "${{ github.repository }}" --body "已恢复正常：run #${RUN_NO} 成功。" && \
            gh issue close "${OPEN_NO}" --repo "${{ github.repository }}"
          fi
          echo "任务成功（run #${RUN_NO}）" >> "$GITHUB_STEP_SUMMARY"

      # 失败时：写运行摘要 + （若仓库开启 Issues）开/更新告警 Issue，绝不静默
      - name: Alert on failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NO: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          {
            echo "## 火花任务失败（run #${RUN_NO}）"
            echo ""
            echo "- 时间(UTC)：$(date -u '+%F %T')"
            echo "- 运行日志：${RUN_URL}"
            echo "- 最可能原因：抖音 Cookie 登录态失效。修复：在电脑浏览器登录抖音 -> Cookie-Editor 导出 Cookie -> 更新 Secret COOKIES_87392064267；或让助手运行 tools/login_and_export.py"
          } >> "$GITHUB_STEP_SUMMARY"

          BODY="火花任务失败（run #${RUN_NO}），时间(UTC)：$(date -u '+%F %T')。日志：${RUN_URL}。最可能原因：抖音 Cookie 登录态失效，需要重新导出 Cookie 并更新 Secret COOKIES_87392064267。"
          OPEN_NO=$(gh issue list --repo "${{ github.repository }}" --state open --label spark-alert --limit 1 --json number -q '.[0].number' 2>/dev/null) || true
          echo "已有未关闭告警 Issue: ${OPEN_NO:-无}"
          if [ -n "${OPEN_NO}" ]; then
            gh issue comment "${OPEN_NO}" --repo "${{ github.repository }}" --body "${BODY}" && echo "已追加告警评论"
          else
            gh label create spark-alert --repo "${{ github.repository }}" --color D93F0B --description "火花任务失败告警" 2>/dev/null
            if gh issue create --repo "${{ github.repository }}" --title "火花任务失败：可能需要重新导出 Cookie" --label spark-alert --body "${BODY}" 2>/dev/null; then
              echo "已创建告警 Issue"
            else
              echo "仓库未开启 Issues 功能，跳过 Issue 告警（已写入运行摘要，另有每日 21:30 本机体检兜底）"
            fi
          fi
